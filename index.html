<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CheBoludo!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* layout idea: party-game lobby look — saturated gradient field, chunky outlined panels, players rail on the left, table in the middle, hand fanned at the bottom */
:root{
  --bg1:#6d28d9; --bg2:#3b1fa8; --panel:rgba(22,10,74,.62); --line:rgba(255,255,255,.2); --edge:#170b45;
  --ink:#fff; --muted:#cfc4f7; --hi:#ffd23f; --hot:#ff4f9a; --ok:#5df2a0; --paper:#fffaf0; --paperink:#1b1140;
  --cw:148px; --ch:200px;
  --disp:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:dark;
}
body[data-skin="atardecer"]{--bg1:#ff7a59;--bg2:#b81f5b;--panel:rgba(70,10,40,.58);--edge:#450a27;--muted:#ffd9d0;--hi:#ffe066;--hot:#8b5cf6}
body[data-skin="menta"]{--bg1:#14b8a6;--bg2:#0b5f8a;--panel:rgba(4,46,62,.62);--edge:#052c3a;--muted:#c4f1ee;--hi:#ffd23f;--hot:#ff6b6b}
body[data-skin="noche"]{--bg1:#232038;--bg2:#0e0d18;--panel:rgba(255,255,255,.06);--edge:#05040a;--muted:#a09bbb;--hi:#d8ff3e;--hot:#ff3e8a}
@media (max-width:820px){:root{--cw:108px;--ch:148px}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg2);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;overflow:clip;-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr}
button,input,textarea{font-family:var(--body)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 600px at 50% -10%,rgba(255,255,255,.18),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2))}
.bg::after{content:'';position:absolute;inset:0;opacity:.1;background-size:220px 220px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M24 46c-7 9-6 25 6 29h14c12-4 13-20 6-29zM20 46h34M42 46l11-27 7 2'/><circle cx='160' cy='50' r='13'/><path d='M178 50h8M142 50h-8M160 32v-8M160 68v8M172.7 37.3l5.7-5.7M147.3 37.3l-5.7-5.7M172.7 62.7l5.7 5.7M147.3 62.7l-5.7 5.7M155 47v1M165 47v1M154 54q6 5 12 0'/><ellipse cx='44' cy='150' rx='22' ry='8'/><path d='M22 150v15c0 4 10 8 22 8s22-4 22-8v-15M22 158c0 4 10 8 22 8s22-4 22-8'/><path d='M134 172a26 26 0 0 1 52 0z'/><path d='M140 169a20 20 0 0 1 40 0' stroke-dasharray='2 6'/><circle cx='105' cy='108' r='14'/><path d='M105 101l6.5 4.7-2.5 7.6h-8l-2.5-7.6zM105 101v-7M111.5 105.7l6-2M109 113.3l4 5.5M101 113.3l-4 5.5M98.5 105.7l-6-2'/><path d='M100 30l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1zM196 116l7 7M203 116l-7 7M92 190l6 6M98 190l-6 6'/></svg>")}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* shared pieces */
.btn{background:var(--hi);color:var(--edge);border:3px solid var(--edge);border-radius:16px;padding:9px 18px;font:900 15px var(--body);cursor:pointer;box-shadow:0 5px 0 var(--edge);transition:transform .1s,box-shadow .1s,opacity .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.alt{background:#fff}
.btn.hot{background:var(--hot);color:#fff}
.btn.ok{background:var(--ok)}
.btn.big{font:400 26px var(--disp);padding:12px 44px;border-radius:22px;letter-spacing:.02em}
.ibtn{background:rgba(255,255,255,.14);border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:6px 11px;font:800 13px var(--body);cursor:pointer;white-space:nowrap}
.ibtn:hover{background:rgba(255,255,255,.26)}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:22px;backdrop-filter:blur(6px)}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance}
.av{display:block;flex:none}
.av svg{display:block;width:100%;height:100%}
.chip{font:900 9.5px var(--body);text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;color:var(--edge);white-space:nowrap}

header{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:10px 16px 6px}
.logo{font:400 26px var(--disp);letter-spacing:.01em;white-space:nowrap;text-shadow:0 3px 0 var(--edge);line-height:1}
.logo span{color:var(--hi)}
#hinfo{margin-left:6px;font-size:13px;color:var(--muted);white-space:nowrap}
#clock{--f:1;width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font:400 17px var(--disp);color:var(--edge);border:3px solid var(--edge);
  background:conic-gradient(var(--hi) calc(var(--f)*360deg),#fff 0)}
#clock.hot{background:conic-gradient(var(--hot) calc(var(--f)*360deg),#fff 0);animation:shake .25s infinite}
@keyframes shake{50%{transform:translateY(1px) rotate(3deg)}}
.hbtns{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:820px){header{padding:8px 10px 4px;gap:8px}.logo{font-size:20px}#hinfo{display:none}.ibtn{padding:5px 8px;font-size:12px}}

/* ===== lobby ===== */
#lobby{position:relative;z-index:1;min-height:0;overflow:auto;padding:8px 16px 18px;display:flex;flex-direction:column;gap:14px;align-items:center}
.lgrid{display:grid;grid-template-columns:300px minmax(0,640px);gap:14px;width:100%;max-width:960px;align-items:start}
@media (max-width:820px){.lgrid{grid-template-columns:1fr}}
.lgrid .panel{padding:18px;display:flex;flex-direction:column;gap:12px}
.lgrid h2{font-size:22px;text-shadow:0 2px 0 var(--edge)}
.lgrid h3{font:900 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:6px}
.tagline{color:var(--muted);font-size:14px;line-height:1.4;margin:0}
.mecard{display:flex;align-items:center;gap:14px}
.bigav{width:96px;height:96px;position:relative;flex:none}
#avRoll{position:absolute;right:-8px;bottom:-6px;width:36px;height:36px;border-radius:50%;border:3px solid var(--edge);background:#fff;font-size:16px;cursor:pointer;box-shadow:0 3px 0 var(--edge)}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.field label,.lbl{font:900 11px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
input[type=text],textarea{background:#fff;color:var(--paperink);border:3px solid var(--edge);border-radius:12px;padding:9px 12px;font:800 16px var(--body);width:100%}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button:not(.ibtn){width:36px;height:36px;border-radius:50%;border:3px solid var(--edge);background:#fff;color:var(--edge);font:900 18px var(--body);cursor:pointer;box-shadow:0 3px 0 var(--edge)}
.stepper b{font:400 26px var(--disp);min-width:22px;text-align:center}
#botPrev{display:flex;flex-direction:column;gap:6px}
.bp{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:12px;padding:5px 8px;font-size:14px}
.bp .av{width:30px;height:30px}
.bp .chips{margin-left:auto;display:flex;gap:3px}
.orow{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;align-items:center}
@media (max-width:560px){.orow{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.pk{background:rgba(255,255,255,.12);border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:7px 13px;font:800 14px var(--body);cursor:pointer}
.seg button[aria-pressed=true],.pk[aria-pressed=true]{background:var(--hi);color:var(--edge);border-color:var(--edge);box-shadow:0 3px 0 var(--edge)}
.hint{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin:-2px 0 2px;line-height:1.35}
.packs{display:flex;flex-wrap:wrap;gap:6px}
.pk i{font-style:normal;opacity:.7;font-size:12px;margin-left:4px}
.pk .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:2px solid var(--edge)}
.twists{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.twists{grid-template-columns:1fr}}
.tw{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid var(--line);color:var(--ink);cursor:pointer}
.tw[aria-pressed=true]{border-color:var(--hi);background:rgba(255,255,255,.16)}
.tw .box{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center;font-size:13px;color:var(--edge)}
.tw[aria-pressed=true] .box{background:var(--hi);border-color:var(--edge)}
.tw b{display:block;font-size:14px;font-weight:900}
.tw small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px;font-weight:700}

.flag{width:22px;height:15px;border-radius:3px;vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.langwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--bg2);border:3px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px;z-index:96;min-width:160px}
.menu button{background:none;border:0;color:var(--ink);font:800 14px var(--body);text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.menu button:hover,.menu button[aria-pressed=true]{background:rgba(255,255,255,.16)}
.skinb{display:inline-flex;align-items:center;gap:8px}
.skinb i{width:20px;height:20px;border-radius:50%;border:2px solid var(--edge);flex:none}
#lobby[data-v=profile] .lgrid{grid-template-columns:minmax(0,440px);justify-content:center}
.mechip{display:flex;align-items:center;gap:10px}
.mechip .av{width:46px;height:46px}
.mechip b{font:400 20px var(--disp);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nodecks [data-d],.nodecks #deckBtn{display:none}
.modal .panel.wide{width:min(780px,100%)}
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(255,255,255,.09);border-radius:14px;padding:9px 12px}
.drow .nm{font-weight:900;flex:1;min-width:130px;overflow-wrap:anywhere}
.drow .nm small{color:var(--muted);font-weight:700}
.drow .btn{padding:5px 12px;font-size:13px;box-shadow:0 3px 0 var(--edge)}
.drow .use[aria-pressed=true]{background:var(--ok);color:var(--edge);border-color:var(--edge)}
.cnt{font:900 12px var(--body);padding:3px 8px;border-radius:8px;border:2px solid var(--edge);white-space:nowrap}
.cnt.k{background:#111;color:#fff}.cnt.w{background:var(--paper);color:var(--paperink)}
.dprev{flex-basis:100%;display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.dprev span{font-size:12.5px;font-weight:800;padding:5px 8px;border-radius:8px;border:2px solid var(--edge);max-width:100%;overflow-wrap:anywhere}
.dprev .k{background:#111;color:#fff}.dprev .w{background:var(--paper);color:var(--paperink)}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.dcols{grid-template-columns:1fr}}
.dcol{border:3px solid var(--edge);border-radius:16px;padding:12px;display:flex;flex-direction:column}
.dcol label{font-size:14px}.dcol small{opacity:.7}
.modal .dcol p{font-size:12.5px;margin:4px 0 8px;color:inherit;opacity:.75;line-height:1.3}
.dcol textarea{min-height:170px;font-size:14px;flex:1}
.dcol.black{background:#111;color:#fff}.dcol.black textarea{background:#1d1d25;color:#fff;border-color:#000}
.dcol.white{background:var(--paper);color:var(--paperink)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ok)}
.avpick{display:flex;flex-wrap:wrap;gap:7px}
.avk{width:38px;height:38px;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;opacity:.75}
.avk svg{display:block;width:100%;height:100%}
.avk:hover{opacity:1}
.avk[aria-pressed=true],.avc[aria-pressed=true]{opacity:1;box-shadow:0 0 0 3px var(--hi)}
.avc{width:24px;height:24px;padding:0;border-radius:50%;border:3px solid var(--edge);cursor:pointer}
.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.modes button{font-size:16px;padding:10px 20px;border-radius:16px}
.blk{display:flex;flex-direction:column;gap:12px}
.coderow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.coderow b{font:400 44px var(--disp);letter-spacing:.14em;color:var(--hi);text-shadow:0 3px 0 var(--edge);line-height:1}
.joinrow{display:flex;gap:8px}
.joinrow input{text-transform:uppercase;letter-spacing:.12em}
#roomPlayers{display:flex;flex-direction:column;gap:6px}
.online [data-t=gamble],.online [data-t=reboot]{display:none}
.pl.gone{opacity:.45}
/* ===== game ===== */
#game{position:relative;z-index:1;min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:0 10px;padding:4px 12px 0;overflow:hidden;overflow:clip}
#players{grid-row:1/3;display:flex;flex-direction:column;gap:8px;padding:10px;margin-bottom:12px;overflow-y:auto;scrollbar-width:none;align-self:start;max-height:calc(100% - 12px)}
#players::-webkit-scrollbar{display:none}
@media (max-width:820px){
  #game{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;padding:2px 8px 0}
  #players{grid-row:auto;flex-direction:row;overflow-x:auto;margin:0 0 6px;padding:10px 8px 6px;max-height:none;border-radius:16px}
}
.pl{position:relative;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:14px;background:rgba(255,255,255,.1);border:2px solid transparent;flex:0 0 auto;transition:background .3s,border-color .3s}
.pl.czar{border-color:var(--hi);background:rgba(255,255,255,.2)}
.pl.me .nm{color:var(--hi)}
.pl .av{width:40px;height:40px;position:relative}
.pl.czar .av::after{content:'♛';position:absolute;top:-17px;left:50%;transform:translateX(-50%);color:var(--hi);font-size:17px;text-shadow:0 2px 0 var(--edge);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-3px)}}
.pl .info{min-width:0;flex:1}
.pl .nm{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.pl .meta{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.pl .sc{font:400 24px var(--disp);min-width:20px;text-align:right;font-variant-numeric:tabular-nums}
.pl .sc.bump{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.7);color:var(--hi)}}
.pl .done{position:absolute;left:30px;top:30px;width:18px;height:18px;border-radius:50%;background:var(--ok);border:2px solid var(--edge);color:var(--edge);font-size:10px;font-weight:900;display:grid;place-items:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.pl.submitted .done{transform:scale(1)}
.bubble{position:fixed;transform:translate(-50%,-6px) scale(.8);opacity:0;background:#fff;color:var(--paperink);border:2px solid var(--edge);font-weight:800;font-size:13px;padding:6px 10px;border-radius:12px;white-space:nowrap;pointer-events:none;transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1);z-index:84}
.bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
.bubble.side{transform:translate(-6px,-50%) scale(.8)}
.bubble.side.show{transform:translate(0,-50%) scale(1)}

#stage{position:relative;display:grid;grid-template-columns:auto 1fr;gap:24px;padding:20px 22px 6px;align-items:center;min-height:0;overflow-y:auto;scrollbar-width:thin}
@media (max-width:820px){#stage{grid-template-columns:1fr;gap:12px;padding:10px;align-content:start}}
.left{display:flex;align-items:center;gap:16px;position:relative;margin-right:96px}
@media (max-width:820px){.left{justify-content:center;gap:10px;margin-right:0}}
#deck{width:calc(var(--cw)*.62);height:calc(var(--ch)*.62);position:relative;flex:none}
#deck i{position:absolute;inset:0;border-radius:10px;background:var(--hot);border:3px solid var(--edge)}
#deck i:nth-child(2){transform:translate(-3px,-3px) rotate(-2deg)}
#deck i:nth-child(3){transform:translate(-6px,-6px) rotate(1.5deg);display:grid;place-items:center;font:400 22px var(--disp);color:#fff;font-style:normal}
@media (max-width:820px){#deck{display:none}}
#black{width:calc(var(--cw)*1.5);min-height:calc(var(--ch)*1.22);background:#111;color:#fff;border:3px solid var(--edge);border-radius:18px;padding:18px 18px 46px;font-weight:900;font-size:clamp(17px,1.9vw,22px);line-height:1.22;box-shadow:0 7px 0 var(--edge);position:relative;transition:box-shadow .4s}
@media (max-width:820px){#black{width:auto;flex:1;max-width:330px;min-height:140px;font-size:17px}}
#black.in{animation:dropIn .6s cubic-bezier(.2,.9,.3,1.15)}
@keyframes dropIn{from{transform:translateY(-50px) rotateX(75deg) scale(.9);opacity:0}}
#black.glow{box-shadow:0 0 0 4px var(--hi),0 0 60px rgba(255,255,255,.35)}
#black .blank{display:inline-block;width:3.2em;border-bottom:3px solid #fff;margin:0 2px;transform:translateY(-3px)}
#black .fill{color:var(--hi);background:rgba(255,255,255,.1);border-radius:4px;padding:0 3px}
#black .fillq{margin-top:12px}
#black .bfoot{position:absolute;left:18px;right:18px;bottom:14px;display:flex;justify-content:space-between;align-items:center;font:900 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#8d88a3}
#black .pick{background:#fff;color:#111;border-radius:999px;padding:3px 8px}
#black .warn{color:var(--hi)}
#event{display:none;position:absolute;left:calc(100% - 26px);top:-16px;width:136px;padding:11px;border-radius:14px;background:var(--hi);color:var(--edge);border:3px solid var(--edge);flex-direction:column;gap:3px;box-shadow:0 5px 0 var(--edge);z-index:5}
#event.show{display:flex;animation:spinIn .95s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes spinIn{from{transform:rotateY(-720deg) scale(.1);opacity:0}to{transform:rotate(6deg)}}
#event .ei{font:400 26px var(--disp);line-height:1}
#event .en{font-weight:900;font-size:15px;line-height:1.1}
#event .ed{font-size:11.5px;line-height:1.25;font-weight:800;opacity:.8}
@media (max-width:820px){#event{position:static;width:96px;padding:8px;align-self:stretch;justify-content:center}#event.show{animation-name:spinInM}#event .ed{display:none}#event .en{font-size:13px}}
@keyframes spinInM{from{transform:rotateY(-720deg) scale(.1);opacity:0}to{transform:none}}

#table{display:flex;flex-wrap:wrap;gap:34px 16px;justify-content:center;align-content:center;min-height:calc(var(--ch)*.9);padding:10px 0 28px}
.sub{display:flex;position:relative;transition:opacity .4s,transform .4s cubic-bezier(.3,1.5,.5,1),filter .4s}
.sub .card{width:calc(var(--cw)*.86);height:calc(var(--ch)*.86)}
.sub .card .front{font-size:calc(var(--cw)*.09)}
.sub .card + .card{margin-left:calc(var(--cw)*-.32);transform:translateY(14px) rotate(4deg)}
.sub.pickable{cursor:pointer}
.sub.pickable:hover,.sub.pickable:focus-visible{transform:translateY(-10px)}
.sub.mine{opacity:.45;cursor:not-allowed}
.sub.scan .front{box-shadow:0 0 0 4px var(--hi)}
.sub.winner{transform:scale(1.12) rotate(-2deg);z-index:5}
.sub.winner .front{box-shadow:0 0 0 4px var(--hi),0 0 40px rgba(255,255,255,.5)}
.sub.dim .card{opacity:.45;filter:grayscale(.7)}
.sub .own{position:absolute;left:50%;bottom:-28px;transform:translate(-50%,8px);opacity:0;font:900 11px var(--body);white-space:nowrap;transition:all .35s;background:var(--edge);padding:2px 9px;border-radius:999px}
.sub.show .own{opacity:1;transform:translate(-50%,0)}
.sub .vt{position:absolute;top:-12px;right:-8px;display:flex;gap:2px;z-index:3}
.sub .vt .av,.vchip{width:24px;height:24px}
.sub .vt .av{animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(0)}}
.vchip{position:fixed;z-index:80;pointer-events:none}

.card{width:var(--cw);height:var(--ch);perspective:900px;flex:none;position:relative}
.tilt{width:100%;height:100%;transform:rotateX(var(--ty,0deg)) rotateY(var(--tx,0deg));transition:transform .18s;transform-style:preserve-3d}
.inner{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.3,1.35,.5,1);transform-style:preserve-3d}
.card.down .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:13px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border:3px solid var(--edge)}
.front{background:var(--paper);color:var(--paperink);padding:11px;display:flex;flex-direction:column;justify-content:space-between;font-weight:900;font-size:calc(var(--cw)*.1);line-height:1.17;transition:box-shadow .25s}
.front .txt{overflow-wrap:anywhere}
.front .blanktxt{color:#8a8296;font-style:italic}
.back{transform:rotateY(180deg);background:var(--hot);display:grid;place-items:center}
.back b{font:400 calc(var(--cw)*.22) var(--disp);color:#fff;text-shadow:0 3px 0 var(--edge)}
.foot{display:flex;justify-content:space-between;align-items:center;font:900 8.5px var(--body);letter-spacing:.05em;text-transform:uppercase;color:#8a8296;gap:4px}
.tag{color:var(--edge);border-radius:999px;padding:2px 6px}

#bottom{position:relative;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;justify-content:center;align-items:center;gap:8px;padding:8px 6px;flex-wrap:wrap;position:relative;z-index:70;min-height:54px}
#status{font-weight:800;font-size:15px;text-align:center;max-width:680px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#status em{font-style:normal;color:var(--hi)}
#bar .btn{padding:7px 14px;font-size:14px}
#reacts{display:flex;gap:4px}
#reacts button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:rgba(255,255,255,.14);font-size:16px;cursor:pointer;padding:0}
#reacts button:hover{transform:scale(1.15)}
.emo{position:fixed;z-index:86;font-size:30px;pointer-events:none}
#handwrap{position:relative;height:calc(var(--ch) + 46px);overflow:visible}
#hand{position:absolute;inset:0}
.hs{position:absolute;left:50%;bottom:-4px;transform:translateX(calc(-50% + var(--x,0px))) translateY(var(--y,0px)) rotate(var(--r,0deg));transform-origin:50% 130%;transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .3s;cursor:pointer;outline:none}
.hs:hover,.hs:focus-visible{transform:translateX(calc(-50% + var(--x,0px))) translateY(-34px) rotate(0deg) scale(1.08);z-index:60!important}
.hs.sel{transform:translateX(calc(-50% + var(--x,0px))) translateY(-50px) rotate(0deg) scale(1.05);z-index:55!important}
.hs.sel .front{box-shadow:0 0 0 4px var(--hot)}
.hs .num,.hs .trash{position:absolute;top:-10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--edge);font-weight:900;font-size:13px;display:grid;place-items:center;z-index:3}
.hs .num{right:-9px;background:var(--hot);color:#fff;animation:pop .3s cubic-bezier(.3,1.8,.5,1)}
.hs .trash{left:-9px;background:#fff;color:var(--edge);cursor:pointer;padding:0;display:none}
#hand.cantrash .hs:hover .trash,#hand.cantrash .hs.sel .trash,#hand.cantrash .hs:focus-within .trash{display:grid}
.hs .trash:hover{background:var(--hot);color:#fff}
#hand.idle .hs{filter:brightness(.7) saturate(.8)}

#banner{position:fixed;left:0;right:0;top:40%;z-index:85;text-align:center;pointer-events:none;opacity:0}
#banner.go{animation:banner 1.5s cubic-bezier(.2,.8,.2,1) forwards}
#banner b{display:block;font:400 clamp(48px,9vw,104px) var(--disp);line-height:.95;text-shadow:0 6px 0 var(--edge)}
#banner span{font:900 14px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--hi);text-shadow:0 2px 0 var(--edge)}
@keyframes banner{0%{opacity:0;transform:scale(1.6)}18%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(.97)}100%{opacity:0;transform:scale(.9) translateY(-20px)}}
.float{position:fixed;z-index:86;font:400 32px var(--disp);color:var(--hi);pointer-events:none;text-shadow:0 3px 0 var(--edge)}

.modal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(10,4,34,.7);padding:16px;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
.modal .panel{background:var(--bg2);padding:24px;width:min(620px,100%);max-height:calc(100% - 8px);overflow:auto;animation:rise .45s cubic-bezier(.2,.9,.3,1.15)}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
.modal h1{font-size:clamp(30px,6vw,46px);line-height:1;text-shadow:0 4px 0 var(--edge)}
.modal h1 span{color:var(--hi)}
.modal p{color:var(--muted);line-height:1.5;margin:8px 0}
.modal h3{font:900 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.rules{padding-left:20px;margin:14px 0 0}
.rules li{margin:7px 0;color:var(--muted);line-height:1.45;font-size:14.5px}
.rules b{color:var(--ink)}
textarea{min-height:96px;resize:vertical}
.rank{list-style:none;padding:0;margin:14px 0 0}
.rank li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:2px solid var(--line)}
.rank li .av{width:32px;height:32px}
.rank li .pos{width:22px;color:var(--muted)}
.rank li .sc{margin-left:auto;font:400 22px var(--disp)}
.best{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.best li{background:#111;border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.35}
.best .fill{color:var(--hi)}
.best small{display:block;color:#a9a4bd;margin-top:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="fx"></canvas>
<div id="banner"><span></span><b></b></div>

<header>
  <div class="logo">Che<span>Boludo!</span></div>
  <div id="hinfo" hidden></div>
  <div id="clock" hidden>0</div>
  <div class="hbtns">
    <div class="langwrap"><button class="ibtn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false"></button>
      <div class="menu" id="langMenu" hidden><button type="button" data-lang="es"></button><button type="button" data-lang="en"></button></div></div>
    <button class="ibtn" id="setBtn" type="button">⚙ <span data-i="bSettings"></span></button>
    <button class="ibtn" id="exitBtn" type="button" data-i="bExit" hidden></button>
  </div>
</header>

<div id="lobby">
  <div class="modes seg" id="modeTabs" data-on="solo friends"><button type="button" data-view="friends" data-i="mFriends"></button><button type="button" data-view="solo" data-i="mSolo"></button></div>
  <div class="lgrid">
    <section class="panel">
      <div class="blk" data-on="profile">
        <h2 data-i="pTitle"></h2>
        <p class="tagline" data-i="pSub"></p>
        <div class="seg" id="pLang"><button type="button" data-lang="es"></button><button type="button" data-lang="en"></button></div>
        <div class="mecard">
          <div class="bigav"><span class="av" id="myAv" style="width:96px;height:96px"></span><button id="avRoll" type="button" title="🎲">🎲</button></div>
          <div class="field"><label for="optName" data-i="lName"></label><input type="text" id="optName" maxlength="14" autocomplete="off"></div>
        </div>
        <h3 data-i="pAvatar"></h3>
        <div class="avpick" id="avKinds"></div>
        <h3 data-i="pColor"></h3>
        <div class="avpick" id="avCols"></div>
        <button class="btn big ok" id="goBtn" type="button"></button>
      </div>
      <div class="mechip" data-on="solo friends host guest"><span class="av" id="meAv"></span><b id="meName"></b><button class="ibtn" type="button" id="editMe" data-on="solo friends" data-i="pEdit"></button></div>
      <div class="blk" data-on="solo">
        <h3 data-i="lRivals"></h3>
        <div class="stepper"><button type="button" id="botLess">−</button><b id="botN">4</b><button type="button" id="botMore">+</button><button class="ibtn" type="button" id="botRoll" data-i="lShuffle"></button></div>
        <div id="botPrev"></div>
        <p class="tagline" data-i="lTag"></p>
      </div>
      <div class="blk" data-on="friends">
        <h3 data-i="fTitle"></h3>
        <button class="btn" type="button" id="mkRoom" data-i="fCreate"></button>
        <label class="lbl" for="codeIn" data-i="fOr"></label>
        <div class="joinrow"><input type="text" id="codeIn" maxlength="8" autocomplete="off" placeholder="ABCD1"><button class="btn alt" type="button" id="joinRoom" data-i="fJoin"></button></div>
        <p class="tagline" id="netMsg" role="status"></p>
      </div>
      <div class="blk" data-on="host guest">
        <h3 data-i="rCode"></h3>
        <div class="coderow"><b id="roomCode"></b><button class="ibtn" type="button" id="copyCode" data-i="rCopy"></button></div>
        <h3 data-i="rPlayers"></h3>
        <div id="roomPlayers"></div>
        <div class="stepper" data-on="host"><span class="lbl" data-i="rBots"></span><button type="button" id="rbLess">−</button><b id="rbN">0</b><button type="button" id="rbMore">+</button></div>
        <p class="tagline" id="roomHint" role="status"></p>
        <div><button class="ibtn" type="button" id="leaveRoom" data-i="rLeave"></button></div>
      </div>
    </section>
    <section class="panel" data-on="solo friends host guest">
      <div class="blk" data-on="solo host">
        <h2 data-i="lSettings"></h2>
        <h3 data-i="sGame"></h3>
        <div id="segs"></div>
        <h3 data-i="sDecks"></h3>
        <div class="packs" id="packs"></div>
        <div class="hint" id="deckCount"></div>
        <div><button class="ibtn" type="button" id="deckBtn" data-i="bDeck"></button></div>
        <h3 data-i="sTwists"></h3>
        <div class="twists" id="twists"></div>
      </div>
      <div class="blk" data-on="friends">
        <h2 data-i="hTitle"></h2>
        <ol class="rules" id="howList"></ol>
      </div>
      <div class="blk" data-on="guest">
        <h2 data-i="gTitle"></h2>
        <p class="tagline" id="roomSummary"></p>
        <p class="tagline" data-i="gWait"></p>
      </div>
    </section>
  </div>
  <button class="btn big ok" id="startBtn" type="button" data-on="solo host"></button>
</div>

<div id="game" hidden>
  <aside id="players" class="panel"></aside>
  <div id="stage">
    <div class="left">
      <div id="deck"><i></i><i></i><i>CB</i></div>
      <div id="black"></div>
      <div id="event"></div>
    </div>
    <div id="table"></div>
  </div>
  <div id="bottom">
    <div id="bar">
      <div id="status"></div>
      <button class="btn alt" id="gambleBtn" type="button" hidden></button>
      <button class="btn alt" id="rebootBtn" type="button" hidden></button>
      <button class="btn alt" id="skipBtn" type="button" hidden></button>
      <button class="btn hot" id="playBtn" type="button" hidden></button>
      <button class="btn ok" id="nextBtn" type="button" hidden data-i="bNext"></button>
      <button class="btn alt" id="oSkip" type="button" hidden></button>
      <button class="btn hot" id="oPlay" type="button" hidden></button>
      <button class="btn ok" id="oNext" type="button" hidden></button>
      <button class="btn alt" id="oForce" type="button" hidden></button>
      <div id="reacts"><button type="button">😂</button><button type="button">💀</button><button type="button">🤢</button><button type="button">👏</button></div>
    </div>
    <div id="handwrap"><div id="hand"></div></div>
  </div>
</div>

<div class="modal" id="rules" hidden><div class="panel">
  <h1 data-i="rTitle"></h1>
  <ul class="rules" id="rulesList"></ul>
  <div class="actions"><button class="btn" id="rulesClose" type="button" data-i="bGot"></button></div>
</div></div>

<div class="modal" id="write" hidden><div class="panel">
  <h1 data-i="wTitle"></h1>
  <p id="writePrompt"></p>
  <textarea id="writeText" maxlength="80" data-ip="wPh"></textarea>
  <div class="actions"><button class="btn alt" id="writeCancel" type="button" data-i="bCancel"></button><button class="btn" id="writeOk" type="button" data-i="bMake"></button></div>
</div></div>

<div class="modal" id="settings" hidden><div class="panel">
  <h1 data-i="sTitle"></h1>
  <h3 data-i="sLang"></h3>
  <div class="seg"><button type="button" data-lang="es"></button><button type="button" data-lang="en"></button></div>
  <h3 data-i="sTheme"></h3>
  <div class="seg">
    <button type="button" class="skinb" data-sk="violeta"><i style="background:linear-gradient(160deg,#6d28d9,#3b1fa8)"></i><span data-i="skin_violeta"></span></button>
    <button type="button" class="skinb" data-sk="atardecer"><i style="background:linear-gradient(160deg,#ff7a59,#b81f5b)"></i><span data-i="skin_atardecer"></span></button>
    <button type="button" class="skinb" data-sk="menta"><i style="background:linear-gradient(160deg,#14b8a6,#0b5f8a)"></i><span data-i="skin_menta"></span></button>
    <button type="button" class="skinb" data-sk="noche"><i style="background:linear-gradient(160deg,#232038,#0e0d18)"></i><span data-i="skin_noche"></span></button>
  </div>
  <h3 data-i="sSound"></h3>
  <div class="seg"><button type="button" id="soundBtn"></button></div>
  <h3 data-i="sHelp"></h3>
  <div class="seg"><button type="button" id="rulesBtn" data-i="sRules"></button></div>
  <div class="actions"><button class="btn" id="setClose" type="button" data-i="bClose"></button></div>
</div></div>

<div class="modal" id="decks" hidden><div class="panel wide">
  <h1 data-i="dTitle"></h1>
  <div class="seg" id="deckTabs" style="margin-top:14px"><button type="button" data-dt="mine" data-i="dMine"></button><button type="button" data-dt="lib" data-i="dLib"></button><button type="button" data-dt="edit" data-i="dNew"></button></div>
  <div id="dMinePane" class="blk"><p class="tagline" data-i="dMineHint"></p><div class="dlist" id="dMineList"></div></div>
  <div id="dLibPane" class="blk"><input type="text" id="dSearch" data-ip="dSearchPh" autocomplete="off" style="margin-top:12px"><p class="tagline" id="dLibMsg" role="status"></p><div class="dlist" id="dLibList"></div></div>
  <div id="dEditPane" class="blk">
    <div class="field" style="margin-top:12px"><label for="dName" data-i="dNameL"></label><input type="text" id="dName" maxlength="30" autocomplete="off"></div>
    <div class="dcols">
      <div class="dcol black"><label for="deckB"><b data-i="dBlack"></b> <small id="dBn"></small></label><p data-i="dBlackHint"></p><textarea id="deckB" data-ip="dBlackPh"></textarea></div>
      <div class="dcol white"><label for="deckW"><b data-i="dWhite"></b> <small id="dWn"></small></label><p data-i="dWhiteHint"></p><textarea id="deckW" data-ip="dWhitePh"></textarea></div>
    </div>
    <label class="chk" for="dPub"><input type="checkbox" id="dPub" checked> <span data-i="dPubL"></span></label>
    <p class="tagline" id="dEditMsg" role="status"></p>
    <div><button class="btn ok" id="deckSave" type="button" data-i="bSave"></button></div>
  </div>
  <div class="actions"><button class="btn alt" id="deckCancel" type="button" data-i="bClose"></button></div>
</div></div>

<div class="modal" id="over" hidden><div class="panel">
  <h1 id="overTitle"></h1>
  <p id="overSub"></p>
  <ul class="rank" id="overRank"></ul>
  <h3 data-i="oBest"></h3>
  <ul class="best" id="overBest"></ul>
  <div class="actions"><button class="btn alt" id="overLobby" type="button" data-i="bLobby"></button><button class="btn" id="overAgain" type="button" data-i="bAgain"></button></div>
</div></div>

function flyFrom(el,fromRect,o={}){
  const {dur=600,rot=0,scale=.7,delay=0,opacity=.2}=o;const to=el.getBoundingClientRect();
  const dx=fromRect.left+fromRect.width/2-(to.left+to.width/2),dy=fromRect.top+fromRect.height/2-(to.top+to.height/2);
  if(reduced)return Promise.resolve();
  return el.animate([{transform:`translate(${dx}px,${dy}px) rotate(${rot}deg) scale(${scale})`,opacity},{transform:'none',opacity:1}],{duration:dur,delay,easing:'cubic-bezier(.2,.8,.2,1.08)',fill:'backwards'}).finished.catch(()=>{});
}
function flyTo(el,toRect,o={}){

  const dx=toRect.left+toRect.width/2-(r.left+r.width/2),dy=toRect.top+toRect.height/2-(r.top+r.height/2);

  return el.animate([{transform:'none',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${rot}deg) scale(.3)`,opacity:0}],{duration:dur,delay,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'}).finished.catch(()=>{});

let AC=null,muted=store.get('sf_muted',false);
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,dur=.08,type='sine',vol=.06,when=0){
  if(muted)return;
  try{const a=ac(),tt=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,tt);
    g.gain.setValueAtTime(vol,tt);g.gain.exponentialRampToValueAtTime(.0001,tt+dur);o.connect(g).connect(a.destination);o.start(tt);o.stop(tt+dur+.03)}catch(e){}
}
function swish(vol=.09){
  if(muted)return;
  try{const a=ac(),len=a.sampleRate*.14,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=rand(1800,3200);f.Q.value=.8;g.gain.value=vol;
    s.connect(f).connect(g).connect(a.destination);s.start()}catch(e){}
}

  vote:()=>tone(rand(600,800),.06,'sine',.06),pop:()=>tone(rand(500,900),.07,'sine',.05)
};

function weight(sub,taste){
  let w=0;sub.cards.forEach(c=>{if(taste.includes(c.tag))w+=3;if(c.tag==='X')w+=2.6;if(c.tag==='C')w+=1.4;w+=Math.random()*2.6});

function pickBest(items,score,worst){let bi=0;const ws=items.map(score);ws.forEach((w,i)=>{if(worst?w<ws[bi]:w>ws[bi])bi=i});return items[bi]}
async function botPlay(p,id,tok){
  const live=()=>{guard(id);return tok===S.playTok};
  await sleep(rand(900,3300));if(!live())return;
  const n=S.black.pick,target=S.czar&&!S.czar.human?S.czar.taste:p.taste,worst=isOpp()&&S.czar&&!S.czar.human;
  const choose=()=>{
    const scored=p.hand.map(c=>({c,w:(target.includes(c.tag)?3:0)+Math.random()*3.2}));
    scored.sort((a,b)=>worst?a.w-b.w:b.w-a.w);
    const cards=scored.slice(0,n).map(x=>x.c);p.hand=p.hand.filter(c=>!cards.includes(c));

  };
  if(S.set.gamble&&p.score>=1&&p.hand.length>=n*2&&Math.random()<.18){
    p.score--;p.stake=1;updatePlayers();bump(p);say(p,line('gamble'));SFX.coin();await sleep(500);if(!live())return;
    await addSub(p,choose(),avRect(p));await sleep(rand(400,900));if(!live())return;
  }

}

function resolveRound(win){

  renderBlack(win.cards);$('#black').classList.add('glow');
  const pts=S.mut&&S.mut.id==='double'?2:1,notes=[];
  w.score+=pts;

    if(p===w){p.score+=p.stake;notes.push(()=>t('nGamble',{a:esc(p.name)}))}else{w.score+=p.stake;notes.push(()=>t('nBet',{a:esc(w.name),b:esc(p.name)}))}
    p.stake=0});

    const others=S.players.filter(p=>p!==w&&p.score>0);
    if(others.length){const m=Math.max(...others.map(p=>p.score)),v=rnd(others.filter(p=>p.score===m));v.score--;w.score++;bump(v);notes.push(()=>t('nHeist',{a:esc(w.name),b:esc(v.name)}))}
  }

  const bots=S.players.filter(p=>!p.human&&!p.rando),losers=bots.filter(p=>p!==w&&p!==S.czar);

function confetti(x,y,n){
  if(reduced)return;
  const cols=['#ff4f9a','#ffd23f','#5ee6c8','#b48cff','#7cc4ff','#ff9f1c','#ffffff'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=3+Math.random()*10;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,r:Math.random()*6.3,vr:(Math.random()-.5)*.4,w:5+Math.random()*7,h:3+Math.random()*5,c:rnd(cols),life:80+Math.random()*70})}

function stepFx(){
  cx.clearRect(0,0,innerWidth,innerHeight);

  for(const p of parts){p.vy+=.27;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));cx.restore()}

}

    close:()=>{stop();send(new Uint8Array([0xE0,0]));setTimeout(()=>{try{ws.close()}catch(e){}},150)}};

}
function mqttRoom(url,code,uid){
  uid=uid||UIDME;

    const base='cheboludo/v1/'+code.toLowerCase()+'/p/',myTopic=base+uid,others=new Map(),hs=new Set();
    let mine={},snap=[],done=false;
    const rebuild=()=>{const now=Date.now();snap=[{peer:uid,isMe:true,kind:'viewer',presence:mine}];
      others.forEach((v,id)=>{if(now-v.at<16000)snap.push({peer:id,isMe:false,kind:'viewer',presence:v.presence});else others.delete(id)});
      hs.forEach(h=>{try{h({peers:snap})}catch(e){}})};
    const room={name:code,connected:()=>core.ready(),peers:()=>snap,
      onPeers:h=>{hs.add(h);setTimeout(rebuild,0);return()=>hs.delete(h)},
      presence:async patch=>{mine={...mine};for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k]}core.pub(myTopic,JSON.stringify(mine),true);rebuild()},
      leave:async()=>{clearInterval(t2);core.pub(myTopic,'',true);core.close()}};
    const core=mqttCore(url,'cb'+uid+Math.random().toString(36).slice(2,8),myTopic,base+'+',
      (topic,payload,dec)=>{if(!topic.startsWith(base))return;const id=topic.slice(base.length);if(id===uid)return;
        if(!payload.length)others.delete(id);else try{const pr=JSON.parse(dec(payload));if(pr&&typeof pr==='object')others.set(id,{presence:pr,at:Date.now()})}catch(e){}
        rebuild()},
      ()=>{core.pub(myTopic,JSON.stringify(mine),true);if(!done){done=true;resolve(room)}},
      ()=>{clearInterval(t2);reject(new Error('no connection'))});
    const t2=setInterval(()=>{if(core.ready())core.pub(myTopic,JSON.stringify(mine),true);rebuild()},5000);
  });
}

function toResult(w){
  const G=NET.G,H=NET.H,o=H.own[w],pts=G.mu==='double'?2:1;
  G.win=w;G.own=H.own.slice();G.pl[o].s+=pts;G.pts=pts;G.steal=-1;
  if(G.mu==='heist'){const ot=[];G.pl.forEach((p,i)=>{if(i!==o&&p.s>0)ot.push(i)});
    if(ot.length){const m=Math.max(...ot.map(i=>G.pl[i].s)),v=rnd(ot.filter(i=>G.pl[i].s===m));G.pl[v].s--;G.pl[o].s++;G.steal=v}}
  H.subs.forEach(s=>s.c.forEach(c=>{if(typeof c==='number')H.wd.push(c)}));
  G.hist=(G.hist||[]).concat([[G.bk,G.subs[w],o,G.r]]).slice(-4);
  const top=Math.max(...G.pl.map(p=>p.s));
  G.champ=top>=G.set.tg?G.pl.findIndex(p=>p.s===top):-1;
  G.ph='result';H.nextAt=Date.now()+(G.champ>=0?4500:NEXT_SEC*1000);G.dl=G.champ>=0?0:H.nextAt;G.dt=NEXT_SEC;

function hostTick(){
  if(!NET||!NET.host)return;refreshPeers();
  const G=NET.G,now=Date.now(),here={};NET.peers.forEach(p=>{here[p.presence.u]=p});
  const force=NET.force;NET.force=false;
  if(G.ph==='lobby'){
    const set=setFromL(),order=G.pl.filter(p=>!p.b&&!p.z&&here[p.u]).map(p=>p.u);
    Object.keys(here).forEach(u=>{if(!order.includes(u))order.push(u)});
    order.sort((a,b)=>(b===UIDME)-(a===UIDME));
    const pl=order.slice(0,8).map(u=>mkHuman(here[u]));
    botOrder.slice(0,L.rbots).forEach(b=>pl.push({u:'bot-'+b.name,n:b.name,a:[b.av.c,b.av.e,b.av.m],s:0,b:1,t:b.taste.join('')}));
    if(set.ra||pl.length<3)pl.push({u:'rando',n:'Don Azar',a:0,s:0,z:1});
    const key=JSON.stringify([set,pl]);if(key!==NET.lobKey){NET.lobKey=key;G.set=set;G.pl=pl;hostPush()}
    return;
  }
  const H=NET.H;let ch=false;
  G.pl.forEach(p=>{if(p.b||p.z)return;if(here[p.u]){H.seen[p.u]=now;if(p.x){delete p.x;ch=true}}else if(!p.x&&now-(H.seen[p.u]||0)>7000){p.x=1;ch=true}});
  const act=i=>{const p=here[G.pl[i].u],a=p&&p.presence.act;return a&&typeof a==='object'&&a.q===G.q?a:null};
  const pick=blk(G.bk).pick,late=G.ph!=='result'&&G.dl&&now>G.dl;
  if(G.ph==='play'){
    const need=[];G.pl.forEach((p,i)=>{if(i!==G.cz&&!p.z&&!p.x)need.push(i)});
    const sk=G.set.m==='vote'?G.pl.findIndex(p=>p.u===G.h):G.cz;
    if(G.set.sk&&H.sk>0&&sk>=0&&!G.pl[sk].b){const a=act(sk);if(a&&a.k==='skip'){
      H.sk--;H.subs.forEach(s=>s.c.forEach(c=>G.hands[s.o].push(typeof c==='number'?c:'B')));G.q++;G.bk=drawB(G.mu==='write');return beginPlay()}}
    need.forEach(i=>{if(G.done.includes(i))return;const p=G.pl[i];
      const tr=!p.b&&here[p.u]&&here[p.u].presence.tr;
      if(G.set.tr&&tr&&tr.r===G.r&&Array.isArray(tr.c)){let n=H.tr[i]|0;
        while(n<Math.min(3,tr.c.length)){const c=tr.c[n++],h=G.hands[i],k=h.indexOf(c);if(typeof c==='number'&&k>=0&&h.filter(x=>x!=='B').length-1>=pick){h.splice(k,1);H.wd.push(c);ch=true}}
        H.tr[i]=n}
      if(p.b){if(now>=(H.botAt[i]||0)){hostSub(i,botChoose(i,pick));ch=true}}
      else{const a=act(i);if(a&&a.k==='play'&&tryPlay(i,a,pick))ch=true}});
    const miss=need.filter(i=>!G.done.includes(i));
    if(late)miss.forEach(i=>hostSub(i,shuffle(G.hands[i].filter(x=>x!=='B')).slice(0,pick)));
    if(H.subs.length&&(late||force||!miss.length))return toJudge();
    if(late){G.dl=0;ch=true}
  }else if(G.ph==='judge'){
    const cz=G.pl[G.cz];let w=-1;
    if(cz.b){if(now>=(H.botAt[G.cz]||0))w=bestIdx(G.subs.map((_,k)=>k),cz.t)}
    else{const a=act(G.cz);if(a&&a.k==='pick'&&Number.isInteger(a.i)&&G.subs[a.i])w=a.i}
    if(w<0&&(force||late||cz.x))w=Math.floor(Math.random()*G.subs.length);
    if(w>=0)return toResult(w);
  }else if(G.ph==='vote'){
    const voters=[];G.pl.forEach((p,i)=>{if(!p.z&&!p.x)voters.push(i)});
    voters.forEach(i=>{if(H.votes[i]!=null)return;const p=G.pl[i];let v=-1;
      if(p.b){if(now>=(H.botAt[i]||0)){const o=G.subs.map((_,k)=>k).filter(k=>H.own[k]!==i);v=o.length?bestIdx(o,p.t):-2}}

      const vt=G.subs.map(()=>[]);Object.keys(H.votes).forEach(i=>{const v=H.votes[i];if(v>=0)vt[v].push(+i)});

    }
  }else if(G.ph==='result'){
    if(force||now>=H.nextAt){if(G.champ>=0){G.ph='over';ch=true}else return startRound()}
  }

}

function netStatus(g,me,can,pick){
  if(NET.lost)return t('nHostGone');
  const nm=i=>esc((g.pl[i]||{}).n||'?'),opp=g.mu==='opposite';
  if(g.ph==='result'||g.ph==='over'){
    const o=g.own?g.own[g.win]:-1,p=g.pl[o]||{};
    return(o===me?t('stWinYou'):p.z?t('stWinRando'):t('stWin',{name:nm(o)}))+(g.steal>=0?' · '+t('nHeist',{a:nm(o),b:nm(g.steal)}):'');
  }
  if(me<0)return t('nSpect');
  if(g.ph==='play'){
    const need=g.pl.filter((p,i)=>i!==g.cz&&!p.z&&!p.x).length;
    if(me===g.cz)return t('stCzarWait')+' ('+g.done.length+'/'+need+')';
    if(!can)return t('nWaitN',{a:g.done.length,b:need});
    const cz=g.pl[g.cz],who=cz?t('nJudgeIs',{name:nm(g.cz)})+(cz.b?t('nLoves',{taste:String(cz.t).split('').filter(x=>TAGS[x]).map(x=>`<em>${tagName(x)}</em>`).join(' + ')}):''):t('stAllVote');
    return(g.mu==='blind'?t('stBlind'):pick>1?t('stPickN',{n:pick}):t('stPick1'))+who+(opp?t('stOpp'):'');

  if(g.ph==='judge')return me===g.cz?(fresh(NET.picked)?t('nSent'):t(opp?'stYouJudgeOpp':'stYouJudge')):t('stDeciding',{name:nm(g.cz)});

}

  else btns+=`<button type="button" class="ibtn use" data-da="use" ${id} aria-pressed="${using}">${t(using?'dUsing':'dUse')}</button>`+(d.mine?`<button type="button" class="ibtn" data-da="edit" ${id}>${t('dEdit')}</button>`:'')+`<button type="button" class="ibtn" data-da="del" ${id}>${t(DK.sure===d.id?'dSure':'dDel')}</button>`;
  return `<div class="drow"><span class="nm">${esc(d.name)}${d.byName?` <small>${t('dBy',{name:esc(d.byName)})}</small>`:''}</span><span class="cnt k" title="${t('dBlack')}">■ ${d.b.length}</span><span class="cnt w" title="${t('dWhite')}">□ ${d.w.length}</span>${btns}`+
    (open?`<div class="dprev">${d.b.map(x=>`<span class="k">${esc(x)}</span>`).join('')}${d.w.map(x=>`<span class="w">${esc(x)}</span>`).join('')}</div>`:'')+`</div>`;
}
function renderDecks(){
  if($('#decks').hidden)return;
  $$('#deckTabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dt===DK.tab));
  $('#dMinePane').hidden=DK.tab!=='mine';$('#dLibPane').hidden=DK.tab!=='lib';$('#dEditPane').hidden=DK.tab!=='edit';
  if(DK.tab==='mine')$('#dMineList').innerHTML=DECKS.length?DECKS.map(d=>deckRow(d,false)).join(''):`<p class="tagline">${t('dMineEmpty')}</p>`;
  if(DK.tab==='lib'){
    const q=DK.q.trim().toLowerCase(),list=[...LIB.decks.values()].filter(d=>!q||d.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,60);
    $('#dLibMsg').textContent=LIB.state==='na'?t('dLibNA'):LIB.state==='conn'?t('nConnecting'):LIB.state==='fail'?t('nNoNet'):list.length?'':t('dLibEmpty');
    $('#dSearch').hidden=LIB.state==='na';
    $('#dLibList').innerHTML=list.map(d=>deckRow(d,true)).join('');
  }
  if(DK.tab==='edit'){$('#dBn').textContent=linesOf($('#deckB').value,40).length;$('#dWn').textContent=linesOf($('#deckW').value,80).length}
}
function deckEdit(id){
  const d=DECKS.find(x=>x.id===id&&x.mine);DK.editId=d?d.id:null;DK.tab='edit';
  $('#dName').value=d?d.name:'';$('#deckB').value=d?d.b.join('\n'):'';$('#deckW').value=d?d.w.join('\n'):'';$('#dPub').checked=d?!!d.pub:true;$('#dEditMsg').textContent='';
  renderDecks();
}
$('#deckBtn').onclick=()=>{$('#decks').hidden=false;DK.sure=null;DK.tab=DECKS.length?'mine':EXT?'lib':'mine';libOpen();renderDecks()};
$('#deckCancel').onclick=()=>$('#decks').hidden=true;
$('#dSearch').addEventListener('input',e=>{DK.q=e.target.value;renderDecks()});
['#deckB','#deckW'].forEach(s=>$(s).addEventListener('input',renderDecks));
$('#deckSave').onclick=()=>{
  const name=$('#dName').value.trim().slice(0,30),b=linesOf($('#deckB').value,40),w=linesOf($('#deckW').value,80);
  if(!name)return $('#dEditMsg').textContent=t('dNeedName');
  if(!b.length&&!w.length)return $('#dEditMsg').textContent=t('dNeedCards');
  let d=DECKS.find(x=>x.id===DK.editId&&x.mine);const was=d&&d.pub;
  if(!d){d={id:rid(),by:AUTHOR,mine:true};DECKS.push(d);L.decks.push(d.id)}
  Object.assign(d,{name,b,w,pub:$('#dPub').checked,byName:(L.name||'').trim().slice(0,14)});
  saveDecks();saveL();
  if(d.pub){libOpen();libPub(d.id,JSON.stringify(deckWire(d)));LIB.decks.set(d.id,cleanDeck(deckWire(d),d.id))}else if(was){libPub(d.id,'');LIB.decks.delete(d.id)}
  DK.tab='mine';renderLobby();renderDecks();
};
$('#decks').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.dt){DK.sure=null;if(b.dataset.dt==='edit')return deckEdit(null);DK.tab=b.dataset.dt;return renderDecks()}
  const id=b.dataset.id,a=b.dataset.da;if(!a)return;
  if(a==='view'){DK.open.has(id)?DK.open.delete(id):DK.open.add(id)}
  else if(a==='use'){L.decks=L.decks.includes(id)?L.decks.filter(x=>x!==id):[...L.decks,id];saveL();renderLobby()}
  else if(a==='edit')return deckEdit(id);
  else if(a==='del'){
    if(DK.sure!==id)DK.sure=id;
    else{const d=DECKS.find(x=>x.id===id);DECKS=DECKS.filter(x=>x.id!==id);L.decks=L.decks.filter(x=>x!==id);DK.sure=null;
      if(d&&d.mine&&d.pub){libPub(id,'');LIB.decks.delete(id)}saveDecks();saveL();renderLobby()}
  }
  else if(a==='add'){const d=LIB.decks.get(id);if(d&&!DECKS.some(x=>x.id===id)){DECKS.push({...d,mine:d.by===AUTHOR,pub:d.by===AUTHOR});L.decks.push(id);saveDecks();saveL();renderLobby()}}
  if(a!=='del')DK.sure=null;
  renderDecks();
});
$('#optName').value=L.name||'';
relang();
</script>
</body>
</html>
